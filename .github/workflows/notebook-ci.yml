name: Crop Fertilizer Notebook CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/launch-path-and-docs]
  workflow_dispatch:

jobs:
  validate-notebook-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt jupyter nbconvert nbclient
      - name: Validate notebook structure
        run: python -c "import nbformat; nbformat.read('FINALPROJ.ipynb', as_version=4)"
      - name: Validate CSV files
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          required = [Path("Crop_recommendation.csv"), Path("Fertilizer Prediction.csv")]
          for path in required:
              if not path.is_file():
                  raise FileNotFoundError(path)
              df = pd.read_csv(path)
              if df.empty:
                  raise ValueError(f"{path} is empty")
              print(f"{path}: {len(df)} rows, {len(df.columns)} columns")
          PY
      - name: Apply notebook compatibility patch
        run: python scripts/patch_notebook_compat.py
      - name: Execute patched notebook
        run: jupyter nbconvert --to notebook --execute FINALPROJ.compat.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=300
      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edunet-executed-notebook
          path: executed.ipynb
          if-no-files-found: ignore
