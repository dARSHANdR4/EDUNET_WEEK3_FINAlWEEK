name: AI Prediction Dashboard CI
on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
  push:
    branches: [feature/ai-prediction-dashboard]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-ci.yml'
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m py_compile dashboard/backend/app/main.py
      - run: python -m pip install -r dashboard/backend/requirements.txt
      - name: Download public Pima training dataset
        run: |
          mkdir -p dashboard/backend/data
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/npradaschnor/Pima-Indians-Diabetes-Dataset/master/diabetes.csv \
            --output dashboard/backend/data/diabetes.csv
      - name: Train and export all three model pipelines
        run: |
          python dashboard/backend/train_models.py \
            --crop-data "Crop_recommendation.csv" \
            --fertilizer-data "Fertilizer Prediction.csv" \
            --diabetes-data dashboard/backend/data/diabetes.csv
      - name: Upload model evaluation report
        uses: actions/upload-artifact@v6
        with:
          name: ai-studio-model-evaluation-report
          path: dashboard/backend/models/evaluation_report.json
          if-no-files-found: error
      - run: pytest -q dashboard/backend/tests
      - run: python -c "import sys; sys.path.insert(0, 'dashboard/backend'); from app.main import app; print(app.title)"
      - name: Build production API container
        run: docker build --file dashboard/backend/Dockerfile --tag ai-prediction-studio-api .
