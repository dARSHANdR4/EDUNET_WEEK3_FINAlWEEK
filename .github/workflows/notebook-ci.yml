name: Crop Fertilizer Notebook CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/launch-path-and-docs]
  workflow_dispatch:

jobs:
  validate-notebook-and-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt jupyter nbconvert nbclient
      - name: Validate notebook structure
        run: python -c "import nbformat; nbformat.read('FINALPROJ.ipynb', as_version=4)"
      - name: Validate CSV files
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          required = [Path("Crop_recommendation.csv"), Path("Fertilizer Prediction.csv")]
          for path in required:
              if not path.is_file():
                  raise FileNotFoundError(path)
              df = pd.read_csv(path)
              if df.empty:
                  raise ValueError(f"{path} is empty")
              print(f"{path}: {len(df)} rows, {len(df.columns)} columns")
          PY
      - name: Execute notebook
        run: jupyter nbconvert --to notebook --execute FINALPROJ.ipynb --output executed.ipynb --ExecutePreprocessor.timeout=300
